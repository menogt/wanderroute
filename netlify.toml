# Netlify build + API proxy configuration.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Synchronous functions default to a 10 s timeout. A Groq call for a long
# itinerary can exceed that, so request the 26 s maximum.
# NOTE: setting this alone is often not enough — Netlify support must also
# enable the extended timeout for the site (Pro plan). Until they do, the
# effective limit stays 10 s and long trips fall back to the static itinerary.
[functions."generate-itinerary"]
  timeout = 26

# Map client-facing API paths to Netlify Functions. Status 200 means rewrite,
# so the URL visible to the browser does not change.
[[redirects]]
  from = "/api/foursquare"
  to = "/.netlify/functions/foursquare"
  status = 200

[[redirects]]
  from = "/api/generate-itinerary"
  to = "/.netlify/functions/generate-itinerary"
  status = 200

# SPA fallback - let the client router handle all other routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
